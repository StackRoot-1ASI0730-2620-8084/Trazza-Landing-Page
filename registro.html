<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Trazza</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo">
                <i class="ph-fill ph-truck"></i>
                <div class="logo-text">
                    <span class="brand">TRAZZA</span>
                </div>
            </a>
            <h2>Create your account</h2>
            <p>Join the smart logistics network</p>
        </div>

        <div class="toggle-container auth-role-toggle">
            <button class="toggle-btn active" id="btn-transportista"><i class="ph ph-truck"></i> Carrier</button>
            <button class="toggle-btn" id="btn-emprendedor"><i class="ph ph-storefront"></i> Entrepreneur</button>
        </div>

        <form class="auth-form" action="index.html">
            <div class="form-group">
                <label for="name">Name or Company Name</label>
                <input type="text" id="name" class="form-input" placeholder="e.g. Logistics SAC" required>
            </div>
            <div class="form-group">
                <label for="doc">RUC or DNI</label>
                <input type="text" id="doc" class="form-input" placeholder="Enter your ID number" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 8px;">Sign Up</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>

    <script src="./scripts/main.js"></script>
</body>
</html>
