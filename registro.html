<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account – Trazza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo" aria-label="Back to Trazza home">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-6 14-6 14-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="19" r="2.5" fill="currentColor"/><circle cx="19" cy="5" r="2.5" fill="currentColor"/></svg>
                </span>
                <span class="logo-text">
                    <span class="brand">Trazza</span>
                    <span class="slogan">SMART LOGISTICS</span>
                </span>
            </a>
            <h2>Create your account</h2>
            <p>Fill your return trips or ship your goods across Lima</p>
        </div>

        <div class="toggle-container auth-role-toggle">
            <button type="button" class="toggle-btn active" id="btn-transportista"><i class="ph ph-truck"></i> Carrier</button>
            <button type="button" class="toggle-btn" id="btn-emprendedor"><i class="ph ph-storefront"></i> Merchant</button>
        </div>

        <form class="auth-form" action="index.html">
            <div class="form-group">
                <label for="name">Name or Company Name</label>
                <input type="text" id="name" class="form-input" placeholder="e.g. Logistics SAC" required>
            </div>
            <div class="form-group">
                <label for="doc">RUC or DNI</label>
                <input type="text" id="doc" class="form-input" placeholder="Enter your ID number" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">Sign up</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script src="./scripts/main.js"></script>
</body>
</html>
